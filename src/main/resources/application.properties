spring.application.name=MealManagementSystem

# ============================================================
# DATABASE CONFIGURATION
# ============================================================
spring.datasource.url=jdbc:h2:mem:mealmanagementdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2

# ============================================================
# JPA/HIBERNATE CONFIGURATION
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
# Disable show-sql in production for performance
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.open-in-view=false

# ============================================================
# FLYWAY CONFIGURATION (Database Migration)
# ============================================================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ============================================================
# H2 CONSOLE (Disabled in production for security)
# ============================================================
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ============================================================
# SERVER CONFIGURATION
# ============================================================
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-binding-errors=always

# ============================================================
# THYMELEAF CONFIGURATION
# ============================================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true

# ============================================================
# STATIC RESOURCES CONFIGURATION
# ============================================================
spring.web.resources.static-locations=classpath:/static/
spring.web.resources.cache.period=3600

# ============================================================
# LOGGING CONFIGURATION
# ============================================================
logging.level.root=INFO
logging.level.com.mealmanager.MealManagementSystem=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ============================================================
# APPLICATION CONFIGURATION
# ============================================================
spring.jackson.serialization-write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true

# ============================================================
# ACTUATOR CONFIGURATION (for health checks and monitoring)
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# ============================================================
# SECURITY CONFIGURATION
# ============================================================
# Enable HTTPS only in production
# server.ssl.enabled=true
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=your-password

# ============================================================
# OPEN API (Swagger) CONFIGURATION
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true