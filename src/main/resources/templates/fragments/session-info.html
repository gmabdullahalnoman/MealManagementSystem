<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="sessionInfo" th:if="${activeSession}" class="card bg-info text-white mb-3">
        <div class="card-body">
            <div class="row">
                <div class="col-md-4">
                    <strong><i class="fas fa-calendar-alt"></i> Active Session:</strong>
                    <span th:text="${activeSession.name}"></span>
                </div>
                <div class="col-md-4">
                    <strong><i class="fas fa-calendar-day"></i> Start Date:</strong>
                    <span th:text="${#temporals.format(activeSession.startDate, 'dd-MM-yyyy')}"></span>
                </div>
                <div class="col-md-4">
                    <strong><i class="fas fa-chart-line"></i> Current Meal Rate:</strong>
                    <span th:text="${mealRate != null ? #numbers.formatDecimal(mealRate, 1, 2) + ' BDT' : 'Not calculated'}"></span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
