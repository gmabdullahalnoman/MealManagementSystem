<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Members', content=~{::content})}">
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-users"></i> Members</h5>
                <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#addMemberModal">
                    <i class="fas fa-plus"></i> Add Member
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Phone</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="member : ${members}">
                                <td th:text="${member.id}"></td>
                                <td th:text="${member.name}"></td>
                                <td th:text="${member.phone != null ? member.phone : '-'}"></td>
                                <td>
                                    <span th:if="${member.isActive}" class="badge bg-success">Active</span>
                                    <span th:unless="${member.isActive}" class="badge bg-danger">Inactive</span>
                                </td>
                                <td>
                                    <button class="btn btn-sm btn-warning" data-bs-toggle="modal" 
                                            data-bs-target="#editMemberModal" 
                                            th:data-id="${member.id}"
                                            th:data-name="${member.name}"
                                            th:data-phone="${member.phone}">
                                        <i class="fas fa-edit"></i>
                                    </button>
                                    <form th:if="${member.isActive}" 
                                          th:action="@{/members/{id}/deactivate(id=${member.id})}" 
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-danger" 
                                                onclick="return confirm('Deactivate this member?')">
                                            <i class="fas fa-user-slash"></i>
                                        </button>
                                    </form>
                                    <form th:unless="${member.isActive}" 
                                          th:action="@{/members/{id}/activate(id=${member.id})}" 
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-success">
                                            <i class="fas fa-user-check"></i>
                                        </button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Add Member Modal -->
        <div class="modal fade" id="addMemberModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/members/create}" method="post">
                        <div class="modal-header bg-success text-white">
                            <h5 class="modal-title">Add New Member</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Name *</label>
                                <input type="text" name="name" class="form-control" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-success">Add Member</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Edit Member Modal -->
        <div class="modal fade" id="editMemberModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/members/update/{id}(id=${editMemberId})}" method="post" th:object="${editMember}">
                        <div class="modal-header bg-warning text-white">
                            <h5 class="modal-title">Edit Member</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <input type="hidden" name="id" th:value="${editMemberId}">
                            <div class="mb-3">
                                <label class="form-label">Name</label>
                                <input type="text" name="name" class="form-control" th:value="${editMemberName}" required>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" name="phone" class="form-control" th:value="${editMemberPhone}">
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-warning">Update</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
        
        <script>
            // Populate edit modal with member data
            $('#editMemberModal').on('show.bs.modal', function(event) {
                var button = $(event.relatedTarget);
                var id = button.data('id');
                var name = button.data('name');
                var phone = button.data('phone');
                
                var modal = $(this);
                modal.find('input[name="id"]').val(id);
                modal.find('input[name="name"]').val(name);
                modal.find('input[name="phone"]').val(phone);
            });
        </script>
    </div>
</body>
</html>
