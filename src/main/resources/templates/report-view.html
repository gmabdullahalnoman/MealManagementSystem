<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Report View', content=~{::content})}">
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-chart-bar"></i> 
                    Report: <span th:text="${report.session.name}"></span>
                </h5>
                <a th:href="@{/reports}" class="btn btn-light btn-sm">
                    <i class="fas fa-arrow-left"></i> Back to Reports
                </a>
            </div>
            <div class="card-body">
                <!-- Session Info -->
                <div class="alert alert-info">
                    <div class="row">
                        <div class="col-md-3">
                            <strong>Session:</strong> <span th:text="${report.session.name}"></span>
                        </div>
                        <div class="col-md-3">
                            <strong>Start Date:</strong> <span th:text="${#temporals.format(report.session.startDate, 'dd-MM-yyyy')}"></span>
                        </div>
                        <div class="col-md-3">
                            <strong>End Date:</strong> 
                            <span th:if="${report.session.endDate}" th:text="${#temporals.format(report.session.endDate, 'dd-MM-yyyy')}"></span>
                            <span th:unless="${report.session.endDate}" class="text-muted">Not closed yet</span>
                        </div>
                        <div class="col-md-3">
                            <strong>Status:</strong>
                            <span th:if="${report.session.isClosed}" class="badge bg-secondary">Closed</span>
                            <span th:unless="${report.session.isClosed}" class="badge bg-success">Active</span>
                        </div>
                    </div>
                </div>
                
                <!-- Summary Cards -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card bg-success text-white">
                            <div class="card-body text-center">
                                <h6>Total Deposit</h6>
                                <h4 th:text="${#numbers.formatDecimal(report.totalDeposit, 1, 2)} + ' BDT'"></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-danger text-white">
                            <div class="card-body text-center">
                                <h6>Total Expense</h6>
                                <h4 th:text="${#numbers.formatDecimal(report.totalExpense, 1, 2)} + ' BDT'"></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-info text-white">
                            <div class="card-body text-center">
                                <h6>Total Meals</h6>
                                <h4 th:text="${report.totalMeals}"></h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card bg-warning text-white">
                            <div class="card-body text-center">
                                <h6>Meal Rate</h6>
                                <h4 th:text="${#numbers.formatDecimal(report.mealRate, 1, 2)} + ' BDT'"></h4>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Member-wise Table -->
                <h6 class="mt-3">Member-wise Breakdown</h6>
                <div class="table-responsive">
                    <table class="table table-bordered table-hover">
                        <thead class="table-dark">
                            <tr>
                                <th>Member</th>
                                <th>Total Deposit</th>
                                <th>Total Meals</th>
                                <th>Total Cost</th>
                                <th>Balance</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="memberReport : ${report.memberReports}">
                                <td th:text="${memberReport.member.name}"></td>
                                <td th:text="${#numbers.formatDecimal(memberReport.totalDeposit, 1, 2)} + ' BDT'"></td>
                                <td th:text="${memberReport.totalMeals}"></td>
                                <td th:text="${#numbers.formatDecimal(memberReport.totalCost, 1, 2)} + ' BDT'"></td>
                                <td th:class="${memberReport.balance >= 0} ? 'text-success fw-bold' : 'text-danger fw-bold'"
                                    th:text="${#numbers.formatDecimal(memberReport.balance, 1, 2)} + ' BDT'"></td>
                            </tr>
                        </tbody>
                        <tfoot class="table-secondary">
                            <tr>
                                <th>Total</th>
                                <th th:text="${#numbers.formatDecimal(report.totalDeposit, 1, 2)} + ' BDT'"></th>
                                <th th:text="${report.totalMeals}"></th>
                                <th th:text="${#numbers.formatDecimal(report.totalExpense, 1, 2)} + ' BDT'"></th>
                                <th th:text="${#numbers.formatDecimal(report.totalDeposit - report.totalExpense, 1, 2)} + ' BDT'"></th>
                            </tr>
                        </tfoot>
                    </table>
                </div>
                
                <!-- Print Button -->
                <div class="mt-3 text-end">
                    <button onclick="window.print()" class="btn btn-secondary">
                        <i class="fas fa-print"></i> Print Report
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
