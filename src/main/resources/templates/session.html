<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Sessions', content=~{::content})}">
<body>
    <div th:fragment="content">
        <div class="card">
            <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                <h5 class="mb-0"><i class="fas fa-calendar-alt"></i> Sessions / Months</h5>
                <button type="button" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#createSessionModal">
                    <i class="fas fa-plus"></i> New Session
                </button>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Start Date</th>
                                <th>End Date</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="session : ${sessions}">
                                <td th:text="${session.id}"></td>
                                <td th:text="${session.name}"></td>
                                <td th:text="${#temporals.format(session.startDate, 'dd-MM-yyyy')}"></td>
                                <td>
                                    <span th:if="${session.endDate}" th:text="${#temporals.format(session.endDate, 'dd-MM-yyyy')}"></span>
                                    <span th:unless="${session.endDate}" class="text-muted">-</span>
                                </td>
                                <td>
                                    <span th:if="${session.isActive}" class="badge bg-success">Active</span>
                                    <span th:if="${session.isClosed}" class="badge bg-secondary">Closed</span>
                                    <span th:unless="${session.isActive or session.isClosed}" class="badge bg-warning">Inactive</span>
                                </td>
                                <td>
                                    <a th:href="@{/reports/session/{id}(id=${session.id})}" class="btn btn-sm btn-info">
                                        <i class="fas fa-chart-bar"></i> Report
                                    </a>
                                    <a th:if="${session.isActive and not session.isClosed}" 
                                       th:href="@{/reports/month-close}" class="btn btn-sm btn-warning">
                                        <i class="fas fa-lock"></i> Close
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        
        <!-- Create Session Modal -->
        <div class="modal fade" id="createSessionModal" tabindex="-1">
            <div class="modal-dialog">
                <div class="modal-content">
                    <form th:action="@{/sessions/create}" method="post">
                        <div class="modal-header bg-primary text-white">
                            <h5 class="modal-title">Create New Session</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                        </div>
                        <div class="modal-body">
                            <div class="mb-3">
                                <label class="form-label">Session Name</label>
                                <input type="text" name="name" class="form-control" required placeholder="e.g., January 2025">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Start Date</label>
                                <input type="date" name="startDate" class="form-control" required>
                            </div>
                        </div>
                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Create Session</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
