<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(title='Deposits', content=~{::content})}">
<body>
    <div th:fragment="content">
        <!-- Summary Card -->
        <div class="card bg-success text-white mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title">Total Deposits (Current Session)</h5>
                        <h2 class="mb-0" th:text="${totalDeposits != null ? #numbers.formatDecimal(totalDeposits, 1, 2) + ' BDT' : '0 BDT'}">0 BDT</h2>
                    </div>
                    <i class="fas fa-money-bill-wave fa-4x opacity-50"></i>
                </div>
            </div>
        </div>
        
        <!-- Add Deposit Form -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0"><i class="fas fa-plus"></i> Add New Deposit</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/deposits/add}" method="post" class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label">Member</label>
                        <select name="memberId" class="form-select" required>
                            <option th:each="member : ${members}" th:value="${member.id}" th:text="${member.name}"></option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Amount (BDT)</label>
                        <input type="number" name="amount" step="0.01" class="form-control" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Date</label>
                        <input type="date" name="depositDate" class="form-control" th:value="${#temporals.format(#temporals.createNow(), 'yyyy-MM-dd')}" required>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Type</label>
                        <select name="type" class="form-select">
                            <option value="REGULAR">Regular</option>
                            <option value="EXTRA">Extra</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Note</label>
                        <input type="text" name="note" class="form-control" placeholder="Optional">
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="fas fa-save"></i> Add
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <!-- Deposits List -->
        <div class="card">
            <div class="card-header bg-info text-white">
                <h5 class="mb-0"><i class="fas fa-list"></i> Deposit History</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover" id="depositsTable">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Member</th>
                                <th>Amount</th>
                                <th>Type</th>
                                <th>Note</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="deposit : ${deposits}">
                                <td th:text="${#temporals.format(deposit.depositDate, 'dd-MM-yyyy')}"></td>
                                <td th:text="${deposit.member.name}"></td>
                                <td class="fw-bold" th:text="${#numbers.formatDecimal(deposit.amount, 1, 2)} + ' BDT'"></td>
                                <td>
                                    <span th:if="${deposit.type == 'REGULAR'}" class="badge bg-info">Regular</span>
                                    <span th:unless="${deposit.type == 'REGULAR'}" class="badge bg-warning">Extra</span>
                                </td>
                                <td th:text="${deposit.note != null ? deposit.note : '-'}"></td>
                                <td>
                                    <form th:action="@{/deposits/{id}/delete(id=${deposit.id})}" method="post" 
                                          onsubmit="return confirm('Delete this deposit?')">
                                        <button type="submit" class="btn btn-sm btn-danger">
                                            <i class="fas fa-trash"></i>
                                        </button>
                                    </form>
                                </td>
                             </tr>
                            <tr th:if="${deposits.empty}">
                                <td colspan="6" class="text-center text-muted">No deposits recorded yet</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
