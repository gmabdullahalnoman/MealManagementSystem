<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:fragment="layout" lang="en">
<head th:fragment="head">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Meal Management System'">MMS</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom CSS -->
    <link th:href="@{/css/style.css}" rel="stylesheet">
    
    <style>
        :root {
            --primary-color: #0d6efd;
            --success-color: #198754;
            --warning-color: #ffc107;
            --danger-color: #dc3545;
        }
        
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .navbar {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        
        .navbar-brand {
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: 0.5px;
        }
        
        .card {
            border: none;
            transition: all 0.3s ease;
        }
        
        .card:hover {
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15) !important;
        }
        
        .btn {
            font-weight: 500;
            transition: all 0.3s ease;
        }
        
        .form-control, .form-select {
            border: 1px solid #dee2e6;
            transition: border-color 0.3s ease;
        }
        
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        
        .table {
            box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075);
        }
        
        .badge {
            font-size: 0.875rem;
            padding: 0.5rem 0.75rem;
        }
        
        .footer {
            background-color: #f8f9fa;
            border-top: 1px solid #dee2e6;
            margin-top: 4rem;
            padding-top: 2rem;
            padding-bottom: 2rem;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 2rem;
            border-radius: 0.5rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary sticky-top">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/dashboard}">
                <i class="bi bi-spoon"></i> Meal Management System
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/dashboard}">
                            <i class="bi bi-speedometer2"></i> Dashboard
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/members}">
                            <i class="bi bi-people-fill"></i> Members
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/sessions}">
                            <i class="bi bi-calendar-check"></i> Sessions
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/deposits}">
                            <i class="bi bi-credit-card"></i> Deposits
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/expenses}">
                            <i class="bi bi-receipt"></i> Expenses
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/meals}">
                            <i class="bi bi-cup-hot"></i> Meals
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:href="@{/reports}">
                            <i class="bi bi-graph-up"></i> Reports
                        </a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid">
        <!-- Session Info Fragment (Fixed at top) -->
        <div th:unless="${#lists.isEmpty(session)}">
            <div th:insert="~{fragments/session-info :: sessionInfo}"></div>
        </div>
        
        <!-- Alerts Fragment -->
        <div th:insert="~{fragments/alerts :: alerts}"></div>
        
        <!-- Page Content -->
        <div th:insert="~{this :: content}"></div>
    </div>

    <!-- Footer -->
    <footer th:fragment="footer" class="footer text-center text-muted mt-5">
        <div class="container">
            <p class="mb-0">
                <small>&copy; 2024 Meal Management System. All rights reserved.</small>
            </p>
            <p class="mb-0 mt-1">
                <small>Version 0.1.0 | <i class="bi bi-heart-fill text-danger"></i> Built with Spring Boot</small>
            </p>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- jQuery for AJAX -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <!-- Custom JS -->
    <script th:src="@{/js/main.js}"></script>
</body>
</html>
