<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <div th:replace="layout.html :: head"></div>
    <title th:text="${member?.id} ? 'Edit Member' : 'Create Member' + ' | Meal Management System'"></title>
</head>
<body>
<div th:replace="layout.html :: navbar"></div>

<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-6">
            <div class="card shadow-lg">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0" th:text="${member?.id} ? 'Edit Member' : 'Create New Member'"></h3>
                </div>
                <div class="card-body">
                    <form th:action="${member?.id} ? @{/members/update/{id}(id=${member.id})} : @{/members/create}" 
                          method="post" class="needs-validation" novalidate>
                        
                        <!-- Name Field -->
                        <div class="mb-3">
                            <label for="nameInput" class="form-label fw-bold">Member Name</label>
                            <input type="text" 
                                   class="form-control form-control-lg" 
                                   id="nameInput" 
                                   name="name" 
                                   th:value="${member?.name}"
                                   placeholder="Enter member name"
                                   required
                                   pattern="^[a-zA-Z\s]+$"
                                   title="Name should contain only letters">
                            <div class="valid-feedback">Looks good!</div>
                            <div class="invalid-feedback">Please provide a valid name.</div>
                        </div>
                        
                        <!-- Phone Field -->
                        <div class="mb-3">
                            <label for="phoneInput" class="form-label fw-bold">Phone Number <span class="text-muted">(Optional)</span></label>
                            <input type="tel" 
                                   class="form-control form-control-lg" 
                                   id="phoneInput" 
                                   name="phone" 
                                   th:value="${member?.phone}"
                                   placeholder="+92 300 0000000"
                                   pattern="^\+?[\d\s\-()]+$"
                                   title="Please enter a valid phone number">
                            <small class="text-muted">Format: +92 300 0000000 or 0300-0000000</small>
                        </div>
                        
                        <!-- Active Status (only for edit) -->
                        <div class="mb-4" th:if="${member?.id}">
                            <div class="form-check form-switch">
                                <input class="form-check-input" 
                                       type="checkbox" 
                                       id="activeCheck"
                                       th:checked="${member?.isActive}"
                                       disabled>
                                <label class="form-check-label" for="activeCheck">
                                    Active Member <span class="badge" th:classappend="${member?.isActive} ? 'bg-success' : 'bg-danger'" th:text="${member?.isActive} ? 'Active' : 'Inactive'"></span>
                                </label>
                            </div>
                        </div>
                        
                        <!-- Buttons -->
                        <div class="d-grid gap-2 d-sm-flex">
                            <button type="submit" class="btn btn-primary btn-lg flex-grow-1">
                                <i class="bi bi-check-circle"></i>
                                <span th:text="${member?.id} ? 'Update Member' : 'Create Member'"></span>
                            </button>
                            <a href="/members" class="btn btn-secondary btn-lg">
                                <i class="bi bi-x-circle"></i> Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:replace="layout.html :: footer"></div>

<script>
    (function() {
        'use strict';
        window.addEventListener('load', function() {
            var forms = document.getElementsByClassName('needs-validation');
            var validation = Array.prototype.filter.call(forms, function(form) {
                form.addEventListener('submit', function(event) {
                    if (form.checkValidity() === false) {
                        event.preventDefault();
                        event.stopPropagation();
                    }
                    form.classList.add('was-validated');
                }, false);
            });
        }, false);
    })();
</script>
</body>
</html>
