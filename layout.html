<!DOCTYPE html> 
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header>
        <h1>Header Content</h1>
        <!-- Insert header fragment -->
        <div th:insert="~{fragments/header :: headerContent}"></div>
    </header>
    <main>
        <div th:insert="~{this :: content}"></div>
    </main>
    <footer>
        <p>Footer Content</p>
        <!-- Insert footer fragment -->
        <div th:insert="~{fragments/footer :: footerContent}"></div>
    </footer>
</body>
</html>
